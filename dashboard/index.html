<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Home Hub Benchmark Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="topbar">
        <div>
          <h1>Smart Home Hub Benchmark</h1>
          <p>System A LLM decisions vs System B Jev decisions with fallback badges.</p>
        </div>
        <label class="file-button">
          Load JSON
          <input id="file-input" type="file" accept="application/json" />
        </label>
      </header>

      <section class="controls">
        <button id="play" type="button">Play</button>
        <button id="reset" type="button">Reset</button>
        <label class="speed-control">
          Speed
          <input id="speed" type="range" min="1" max="50" step="1" value="2" />
          <span id="speed-value">2x</span>
        </label>
        <span id="event-label">No run loaded</span>
      </section>

      <section class="plans">
        <article class="system" data-system="A">
          <div class="system-heading">
            <h2>System A</h2>
            <span id="elapsed-A">0 ms</span>
          </div>
          <div class="event-line" id="event-A">No record loaded</div>
          <div class="floor-plan" id="plan-A"></div>
          <div class="details" id="details-A"></div>
        </article>
        <article class="system" data-system="B">
          <div class="system-heading">
            <h2>System B</h2>
            <span id="elapsed-B">0 ms</span>
          </div>
          <div class="event-line" id="event-B">No record loaded</div>
          <div class="floor-plan" id="plan-B"></div>
          <div class="details" id="details-B"></div>
        </article>
      </section>

      <section class="summary">
        <h2>Summary</h2>
        <div class="details" id="summary">Load a benchmark JSON file to begin.</div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
